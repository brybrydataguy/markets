<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="framework-title framework-desc">
  <title id="framework-title">An Eisman-style investment inquiry</title>
  <desc id="framework-desc">Move from the business to its cash generation, constraints and funding. Test incentives, valuation and evidence, then update the original thesis.</desc>
  <defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="currentColor"/></marker></defs>
  <g fill="var(--paper)" stroke="var(--line)" stroke-width="1.5">
    <rect x="10" y="20" width="300" height="142" rx="8"/>
    <rect x="350" y="20" width="300" height="142" rx="8"/>
    <rect x="690" y="20" width="300" height="142" rx="8"/>
    <rect x="690" y="225" width="300" height="142" rx="8"/>
    <rect x="350" y="225" width="300" height="142" rx="8"/>
    <rect x="10" y="225" width="300" height="142" rx="8"/>
  </g>
  <g fill="none" stroke="var(--blue)" stroke-width="2" marker-end="url(#flow-arrow)">
    <path d="M315 91H340"/><path d="M655 91H680"/><path d="M840 168V214"/>
    <path d="M685 296H660"/><path d="M345 296H320"/>
  </g>
  <g fill="var(--blue)" font-family="system-ui,sans-serif" font-size="13" font-weight="650">
    <text x="32" y="50">01 / BUSINESS</text><text x="372" y="50">02 / CASH</text><text x="712" y="50">03 / CONSTRAINT</text>
    <text x="712" y="255">04 / FUNDING &amp; INCENTIVES</text><text x="372" y="255">05 / PRICE &amp; TEST</text><text x="32" y="255">06 / UPDATE</text>
  </g>
  <g fill="var(--ink)" font-family="Georgia,serif" font-size="23">
    <text x="32" y="88">Why does it earn?</text><text x="372" y="88">Does growth pay?</text><text x="712" y="88">What limits growth?</text>
    <text x="712" y="293">Who bears the loss?</text><text x="372" y="293">What is priced in?</text><text x="32" y="293">What changed?</text>
  </g>
  <g fill="var(--muted)" font-family="system-ui,sans-serif" font-size="15">
    <text x="32" y="119">Customer, advantage, competition</text><text x="32" y="141">and durability</text>
    <text x="372" y="119">Capex, dilution, replacement</text><text x="372" y="141">and free cash flow</text>
    <text x="712" y="119">Power, supply, capacity,</text><text x="712" y="141">affordability or capital</text>
    <text x="712" y="324">Leverage, maturities, promises</text><text x="712" y="346">and conflicts of interest</text>
    <text x="372" y="324">Expected return, horizon</text><text x="372" y="346">and falsifying evidence</text>
    <text x="32" y="324">Revise the mechanism;</text><text x="32" y="346">preserve the prior dated view</text>
    <text x="10" y="409">A reconstructed checklist, not a mechanical model or a quotation.</text>
  </g>
</svg>
