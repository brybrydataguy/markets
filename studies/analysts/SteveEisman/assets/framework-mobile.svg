  <text x="22" y="30">01 / BUSINESS</text><text x="22" y="186">02 / CASH</text><text x="22" y="342">03 / CONSTRAINT</text>
  <text x="22" y="498">04 / FUNDING &amp; INCENTIVES</text><text x="22" y="654">05 / PRICE &amp; TEST</text><text x="22" y="810">06 / UPDATE</text>
